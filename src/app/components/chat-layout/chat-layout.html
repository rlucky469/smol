<section
  class="main-container overflow-hidden"
  [ngClass]="{ active: isSideBarMini }"
>
  <div class="side-bar" [ngClass]="isSideBarHide ? 'visibleSidebar' : ''">
    <app-side-bar
      [isSideBarMini]="isSideBarMini"
      (handleSidebar)="handleSideBar($event)"
      (handleSidebarMobile)="handleSidebarMobile($event)"
    ></app-side-bar>
  </div>

  <div class="main">
    <div class="container h-100">
      <div class="d-flex flex-column h-100 position-relative">
        <div
          class="d-flex justify-content-between mobile-menu align-items-center py-2 d-md-none border-bottom"
        >
          <div class="toggle" (click)="isSideBarHide = !isSideBarHide">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 128 128"
              id="sidebar"
            >
              <rect
                width="97"
                height="97"
                x="15"
                y="16"
                stroke="#34a853"
                stroke-width="7"
                rx="27"
                class="colorStroke000000 svgStroke"
              ></rect>
              <path
                stroke="#34a853"
                stroke-linecap="round"
                stroke-width="7"
                d="M46 17L46 112"
                class="colorStroke000000 svgStroke"
              ></path>
              <path
                stroke="#34a853"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="7"
                d="M73 79L74.9027 77.6569C79.2802 74.5669 83.2134 70.8912 86.5923 66.7326V66.7326C87.4125 65.7231 87.4125 64.2769 86.5923 63.2674V63.2674C83.2134 59.1088 79.2802 55.4331 74.9027 52.3431L73 51"
                class="colorStroke000000 svgStroke"
              ></path>
            </svg>
          </div>
          <div class="logo">
            <img src="../../../assets/logo-icon1.png" width="40px" />
          </div>
          <div class="new-chat">
            <a
              class=" body_text"
              [routerLink]="'/app'"
              style="cursor: pointer"
           
            >
              <p>
                <i class="fal fa-comment-dots fs-4 "></i>
              </p>
            </a>
          </div>
        </div>
        <!-- <div class="chat-header border-bottom py-4 py-lg-7 d-none d-md-block">
          <div class="row align-items-center ">
            <h1 class="heading">AI Chat</h1>
          </div>
        </div> -->

        <!-- <app-chat-box  style="height: 100%; display: block;"></app-chat-box> -->
        <app-conversation style="height: 100%; display: block">
        </app-conversation>
      </div>
      <!-- <div class="col-lg-3 col-md-4 d-none d-lg-block bg-white">
            <app-download-history></app-download-history>
          </div> -->
    </div>
  </div>

  <!-- <app-download-history></app-download-history> -->
</section>
